<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Baby Cam</title>
    <style>
        :root {
            --background: #09090B;
            --foreground: #FAFAFA;
            --card: #18181B;
            --card-foreground: #FAFAFA;
            --primary: #FAFAFA;
            --primary-foreground: #18181B;
            --secondary: #27272A;
            --secondary-foreground: #FAFAFA;
            --muted: #27272A;
            --muted-foreground: #A1A1AA;
            --border: #27272A;
            --input: #27272A;
            --ring: #52525B;
            --radius: 6px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

        html, body { height: 100%; }

        body {
            background: var(--background);
            color: var(--foreground);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            min-height: 100dvh;
            padding: 16px;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        }

        .container { max-width: 420px; width: 100%; }

        h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.025em;
             margin-bottom: 8px; text-align: center; }

        .subtitle { text-align: center; font-size: 14px;
                     color: var(--muted-foreground); margin-bottom: 24px; }

        #status {
            text-align: center; padding: 8px 16px;
            background: var(--muted); border: 1px solid var(--border);
            border-radius: var(--radius); margin-bottom: 16px;
            font-size: 13px; color: var(--muted-foreground);
        }
        #status.connected { background: #052e16; border-color: #166534; color: #4ade80; }
        #status.error { background: #450a0a; border-color: #991b1b; color: #f87171; }

        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: calc(var(--radius) * 2); padding: 24px; margin-bottom: 16px;
        }
        .card label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
        .card input {
            width: 100%; padding: 10px 12px; border: 1px solid var(--input);
            border-radius: var(--radius); font-size: 14px; margin-bottom: 16px;
            background: var(--background); color: var(--foreground); outline: none;
            transition: border-color 0.15s;
        }
        .card input:focus { border-color: var(--ring); box-shadow: 0 0 0 2px rgba(82,82,91,0.3); }
        .card input::placeholder { color: var(--muted-foreground); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 10px 16px; font-size: 14px; font-weight: 500; border: none;
            border-radius: var(--radius); cursor: pointer; transition: opacity 0.15s; width: 100%;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { opacity: 0.8; }
        .btn-primary { background: var(--primary); color: var(--primary-foreground); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* --- Video --- */
        #video-wrapper { position: relative; display: none; background: #000; }
        #remote-video { width: 100%; background: #000; display: block; }

        #video-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            display: flex; justify-content: center; gap: 8px;
            padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom));
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            opacity: 1; transition: opacity 0.3s;
        }
        #video-overlay.auto-hide { opacity: 0; }
        #video-wrapper:hover #video-overlay.auto-hide,
        #video-overlay.auto-hide:focus-within { opacity: 1; }

        #video-overlay .btn {
            width: auto; padding: 8px 16px; font-size: 13px;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15); color: #fff;
        }
        #video-overlay .btn:hover { background: rgba(255,255,255,0.2); }

        /* --- Streaming mode --- */
        body.streaming {
            padding: 0; background: #000; overflow: hidden;
            justify-content: stretch; align-items: stretch;
        }
        body.streaming .container {
            max-width: 100%; width: 100%;
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column;
        }
        body.streaming h1,
        body.streaming .subtitle,
        body.streaming #settings-panel,
        body.streaming #status { display: none; }

        body.streaming #video-wrapper {
            display: flex; flex: 1;
            align-items: center; justify-content: center;
            width: 100%; height: 100vh; height: 100dvh;
            border-radius: 0;
        }
        body.streaming #remote-video {
            width: 100%; height: 100%;
            max-width: 100vw;
            max-height: 100vh; max-height: 100dvh;
            object-fit: contain;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Baby Cam</h1>
        <p class="subtitle">Enter your token to start viewing</p>

        <div id="settings-panel" class="card">
            <label for="token-input">Token</label>
            <input type="password" id="token-input" placeholder="Enter your token">
            <button class="btn btn-primary" id="connect-btn">Connect</button>
        </div>

        <div id="status">Not connected</div>

        <div id="video-wrapper">
            <video id="remote-video" autoplay playsinline></video>
            <div id="video-overlay">
                <button class="btn" id="fullscreen-btn">Fullscreen</button>
                <button class="btn" id="disconnect-btn">Disconnect</button>
            </div>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const remoteVideo = document.getElementById('remote-video');
        const connectBtn = document.getElementById('connect-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const settingsPanel = document.getElementById('settings-panel');
        const tokenInput = document.getElementById('token-input');
        const videoWrapper = document.getElementById('video-wrapper');
        const videoOverlay = document.getElementById('video-overlay');

        const signalingServer = window.location.hostname + ':8081';

        let signalingWs = null;
        let peerConnection = null;
        let myClientId = null;
        const roomName = 'baby';
        let remoteDescriptionSet = false;
        let pendingRemoteIceCandidates = [];
        let overlayTimeout = null;
        let currentToken = null;
        let stallCheckInterval = null;
        let lastVideoTime = 0;
        let stallCount = 0;
        let wsKeepAlive = null;

        function setStatus(message, type = 'normal') {
            statusEl.textContent = message;
            statusEl.className = type;
        }
        function setError(message) { setStatus(message, 'error'); console.error(message); }

        // --- Video stall detection: if currentTime stops advancing, video is frozen ---
        function startStallDetection() {
            stopStallDetection();
            stallCount = 0;
            lastVideoTime = remoteVideo.currentTime;
            stallCheckInterval = setInterval(() => {
                if (!remoteVideo.srcObject || remoteVideo.paused) return;
                const t = remoteVideo.currentTime;
                if (t === lastVideoTime) {
                    stallCount++;
                    console.warn(`Video stall detected (${stallCount})`);
                    if (stallCount >= 3) {
                        // 3 consecutive stalls (~6 seconds) — force play or reconnect
                        remoteVideo.play().catch(() => {});
                        if (stallCount >= 5) {
                            console.error('Persistent stall, triggering reconnect');
                            stallCount = 0;
                            softReconnect();
                        }
                    }
                } else {
                    stallCount = 0;
                }
                lastVideoTime = t;
            }, 2000);
        }

        function stopStallDetection() {
            if (stallCheckInterval) { clearInterval(stallCheckInterval); stallCheckInterval = null; }
        }

        // Soft reconnect: close PC only, keep signaling WS alive, wait for new offer
        function softReconnect() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            remoteDescriptionSet = false;
            pendingRemoteIceCandidates = [];
            setStatus('Reconnecting...', 'normal');
            // Camera will detect ICE failure and send a new offer via ICE restart
        }

        function enterStreamingMode() {
            document.body.classList.add('streaming');
            startOverlayAutoHide();
        }
        function exitStreamingMode() {
            document.body.classList.remove('streaming');
            videoOverlay.classList.remove('auto-hide');
            if (overlayTimeout) clearTimeout(overlayTimeout);
        }
        function startOverlayAutoHide() {
            if (overlayTimeout) clearTimeout(overlayTimeout);
            videoOverlay.classList.remove('auto-hide');
            overlayTimeout = setTimeout(() => videoOverlay.classList.add('auto-hide'), 3000);
        }

        videoWrapper.addEventListener('click', (e) => {
            if (e.target === remoteVideo || e.target === videoWrapper) startOverlayAutoHide();
        });
        videoWrapper.addEventListener('touchstart', (e) => {
            if (e.target === remoteVideo || e.target === videoWrapper) startOverlayAutoHide();
        }, { passive: true });
        videoWrapper.addEventListener('mousemove', () => {
            if (document.body.classList.contains('streaming')) startOverlayAutoHide();
        });

        fullscreenBtn.addEventListener('click', () => {
            const el = videoWrapper;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            else if (remoteVideo.webkitEnterFullscreen) remoteVideo.webkitEnterFullscreen();
        });

        // iOS Safari: resume playback when exiting fullscreen (iOS pauses video on exit)
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && remoteVideo.srcObject) {
                remoteVideo.play().catch(() => {});
            }
        });
        document.addEventListener('webkitfullscreenchange', () => {
            if (!document.webkitFullscreenElement && remoteVideo.srcObject) {
                remoteVideo.play().catch(() => {});
            }
        });
        remoteVideo.addEventListener('webkitendfullscreen', () => {
            // iOS video element inline fullscreen exit
            if (remoteVideo.srcObject) remoteVideo.play().catch(() => {});
        });

        connectBtn.addEventListener('click', async () => {
            const token = tokenInput.value.trim();
            if (!token) { setError('Please enter your token'); return; }
            localStorage.setItem('signaling_token', token);
            currentToken = token;
            await connect(signalingServer, token);
        });

        disconnectBtn.addEventListener('click', () => disconnect());

        async function connect(server, token) {
            setStatus('Connecting...');
            connectBtn.disabled = true;

            try {
                signalingWs = new WebSocket(`ws://${server}`);

                signalingWs.onopen = () => {
                    setStatus('Joining room...');
                    signalingWs.send(JSON.stringify({
                        type: 'join', room: roomName, role: 'viewer', token
                    }));
                    // Keepalive: prevent WebSocket idle timeout
                    if (wsKeepAlive) clearInterval(wsKeepAlive);
                    wsKeepAlive = setInterval(() => {
                        if (signalingWs?.readyState === WebSocket.OPEN) {
                            signalingWs.send('{"type":"ping"}');
                        }
                    }, 15000);
                };

                signalingWs.onmessage = async (event) => {
                    const msg = JSON.parse(event.data);

                    switch (msg.type) {
                        case 'joined':
                            myClientId = msg.clientId;
                            setStatus('Waiting for camera...');
                            settingsPanel.classList.add('hidden');
                            break;
                        case 'peer_joined':
                            if (msg.role === 'camera') {
                                setStatus('Camera found...');
                                createPeerConnection();
                            }
                            break;
                        case 'offer':
                            await handleOffer(msg.sdp);
                            break;
                        case 'ice':
                            await handleIceCandidate(msg.candidate);
                            break;
                        case 'peer_left':
                            if (msg.role === 'camera') {
                                setStatus('Camera disconnected. Waiting for reconnect...');
                                // Don't exit streaming mode — camera may reconnect after rotation
                                if (peerConnection) {
                                    peerConnection.close();
                                    peerConnection = null;
                                }
                                remoteDescriptionSet = false;
                                pendingRemoteIceCandidates = [];
                            }
                            break;
                        case 'error':
                            setError(msg.message);
                            disconnect();
                            break;
                    }
                };

                signalingWs.onerror = () => { setError('Connection error'); };
                signalingWs.onclose = () => {
                    if (wsKeepAlive) { clearInterval(wsKeepAlive); wsKeepAlive = null; }
                    if (statusEl.className !== 'error') {
                        setStatus('Signaling lost, reconnecting...');
                        // Auto-reconnect after 2 seconds
                        if (currentToken) {
                            setTimeout(() => {
                                if (!signalingWs && currentToken) {
                                    connect(signalingServer, currentToken);
                                }
                            }, 2000);
                        }
                    }
                };
            } catch (error) {
                setError(error.message);
                connectBtn.disabled = false;
            }
        }

        function createPeerConnection() {
            // Close existing PC if any (e.g., camera reconnected after rotation)
            if (peerConnection) {
                try { peerConnection.close(); } catch(_) {}
            }
            remoteDescriptionSet = false;
            pendingRemoteIceCandidates = [];

            peerConnection = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && signalingWs?.readyState === WebSocket.OPEN) {
                    signalingWs.send(JSON.stringify({
                        type: 'ice', room: roomName,
                        candidate: {
                            sdpMid: event.candidate.sdpMid,
                            sdpMLineIndex: event.candidate.sdpMLineIndex,
                            candidate: event.candidate.candidate
                        }
                    }));
                }
            };

            peerConnection.ontrack = (event) => {
                if (event.streams?.[0]) {
                    remoteVideo.srcObject = event.streams[0];
                    remoteVideo.play().catch(() => {});
                    setStatus('Live', 'connected');
                    enterStreamingMode();
                    startStallDetection();
                }
            };

            peerConnection.oniceconnectionstatechange = () => {
                const state = peerConnection?.iceConnectionState;
                if (state === 'failed') {
                    setError('Connection failed');
                } else if (state === 'disconnected') {
                    setStatus('Reconnecting...', 'normal');
                    // Don't immediately error — WebRTC may recover
                }
            };
        }

        async function handleOffer(sdp) {
            if (!peerConnection) createPeerConnection();
            try {
                await peerConnection.setRemoteDescription({ type: 'offer', sdp });
                remoteDescriptionSet = true;
                await flushPendingRemoteIceCandidates();
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                signalingWs.send(JSON.stringify({
                    type: 'answer', room: roomName, sdp: answer.sdp
                }));
            } catch (error) {
                setError(error.message);
            }
        }

        async function handleIceCandidate(candidate) {
            if (!peerConnection || !remoteDescriptionSet) {
                pendingRemoteIceCandidates.push(candidate);
                return;
            }
            try {
                await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
            } catch (e) { console.error('ICE error:', e); }
        }

        async function flushPendingRemoteIceCandidates() {
            const queue = pendingRemoteIceCandidates.splice(0);
            for (const c of queue) {
                try { await peerConnection.addIceCandidate(new RTCIceCandidate(c)); }
                catch (e) { console.error('ICE error:', e); }
            }
        }

        function disconnect() {
            currentToken = null;  // stop auto-reconnect
            stopStallDetection();
            if (wsKeepAlive) { clearInterval(wsKeepAlive); wsKeepAlive = null; }
            signalingWs?.close(); signalingWs = null;
            peerConnection?.close(); peerConnection = null;
            myClientId = null;
            remoteDescriptionSet = false;
            pendingRemoteIceCandidates = [];
            remoteVideo.srcObject = null;
            exitStreamingMode();
            setStatus('Disconnected');
            settingsPanel.classList.remove('hidden');
            connectBtn.disabled = false;
        }

        window.addEventListener('load', () => {
            const t = localStorage.getItem('signaling_token');
            if (t) tokenInput.value = t;
        });
    </script>
</body>
</html>
